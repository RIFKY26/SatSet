apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service-deployment
  labels:
    app: location-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: location-service
  template:
    metadata:
      labels:
        app: location-service
    spec:
      containers:
      - name: location-service
        image: kingdil/satset-location-service:latest
        ports:
        - containerPort: 8083

---

apiVersion: v1
kind: Service
metadata:
  name: location-service
spec:
  selector:
    app: location-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8083