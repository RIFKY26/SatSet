apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service-deployment
  labels:
    app: rating-service
spec:
  replicas: 2 # Kita suruh Kubernetes menjalankan 2 copy aplikasi biar aman
  selector:
    matchLabels:
      app: rating-service
  template:
    metadata:
      labels:
        app: rating-service
    spec:
      containers:
      - name: rating-service
        # Nanti akun dockerhub disesuaikan dengan akunmu
        image: kingdil/satset-rating:latest 
        ports:
        - containerPort: 8087 # Ini port asli dari main.go user_service

---

apiVersion: v1
kind: Service
metadata:
  name: rating-service # Nama ini yang akan dipanggil oleh pintu masuk (Ingress)
spec:
  selector:
    app: rating-service
  ports:
    - protocol: TCP
      port: 80         # Port internal Kubernetes
      targetPort: 8087 # Diarahkan ke port aplikasi Go-mu