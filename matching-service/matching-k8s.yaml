apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service-deployment
  labels:
    app: matching-service
spec:
  replicas: 2 # Kita suruh Kubernetes menjalankan 2 copy aplikasi biar aman
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
    spec:
      containers:
      - name: matching-service
        # Nanti akun dockerhub disesuaikan dengan akunmu
        image: kingdil/satset-matching-service:latest 
        ports:
        - containerPort: 8084 # Ini port asli dari main.go user_service

---

apiVersion: v1
kind: Service
metadata:
  name: matching-service # Nama ini yang akan dipanggil oleh pintu masuk (Ingress)
spec:
  selector:
    app: matching-service
  ports:
    - protocol: TCP
      port: 80         # Port internal Kubernetes
      targetPort: 8084 # Diarahkan ke port aplikasi Go-mu