apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-deployment
  labels:
    app: payment-service
spec:
  replicas: 2 # Kita suruh Kubernetes menjalankan 2 copy aplikasi biar aman
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        # Nanti akun dockerhub disesuaikan dengan akunmu
        image: akun-dockerhub-kamu/satset-payment:latest 
        ports:
        - containerPort: 8080 # Ini port asli dari main.go user_service

---

apiVersion: v1
kind: Service
metadata:
  name: payment-service # Nama ini yang akan dipanggil oleh pintu masuk (Ingress)
spec:
  selector:
    app: payment-service
  ports:
    - protocol: TCP
      port: 80         # Port internal Kubernetes
      targetPort: 8080 # Diarahkan ke port aplikasi Go-mu