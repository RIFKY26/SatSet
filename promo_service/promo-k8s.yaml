apiVersion: apps/v1
kind: Deployment
metadata:
  name: promo-service-deployment
  labels:
    app: promo-service
spec:
  replicas: 2 # Kita suruh Kubernetes menjalankan 2 copy aplikasi biar aman
  selector:
    matchLabels:
      app: promo-service
  template:
    metadata:
      labels:
        app: promo-service
    spec:
      containers:
      - name: promo-service
        # Nanti akun dockerhub disesuaikan dengan akunmu
        image: kingdil/satset-promo-service:latest
        ports:
        - containerPort: 8086 # Ini port asli dari main.go user_service

---

apiVersion: v1
kind: Service
metadata:
  name: promo-service # Nama ini yang akan dipanggil oleh pintu masuk (Ingress)
spec:
  selector:
    app: promo-service
  ports:
    - protocol: TCP
      port: 80         # Port internal Kubernetes
      targetPort: 8086 # Diarahkan ke port aplikasi Go-mu